server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: any unknown path (like /requests/5) gets index.html,
    # then React shows the right page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a hash in the file names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}