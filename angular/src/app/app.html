<button type="button" class="skip-link" (click)="skipToMain()">Skip to main content</button>

<div class="app">
  <header class="app-header">
    <span class="brand">Northline Job Manager</span>
    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/requests" routerLinkActive="active" [routerLinkActiveOptions]="requestsLinkMatch">Requests</a>
      <a routerLink="/requests/new" routerLinkActive="active">New request</a>
    </nav>
    <span>Sample data</span>
  </header>
  <main #main class="container" tabindex="-1">
    <router-outlet />
  </main>
</div>
